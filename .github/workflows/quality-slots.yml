name: Quality Slots

on:
  workflow_call:

permissions:
  contents: read
  actions: write

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  s1-types:
    name: "S1: Types"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tested-sha: ${{ steps.tested-sha.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup JavaScript
        uses: nocoo/base-ci/.github/actions/setup-js@e5876a604547b1ddb0916f16dd841a4f832609a0 # v2026.20
        with:
          package-manager: bun
          install-policy: blocked
      - name: Record installed dependency state
        run: bun scripts/quality/install-state.mjs --write
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: "probe"
      - name: Check TypeScript and Rust types
        run: |
          bun turbo typecheck
          cargo check --locked --all-features --manifest-path probe/Cargo.toml
      - name: Record tested SHA
        id: tested-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  s2-lint:
    name: "S2: Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tested-sha: ${{ steps.tested-sha.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup JavaScript
        uses: nocoo/base-ci/.github/actions/setup-js@e5876a604547b1ddb0916f16dd841a4f832609a0 # v2026.20
        with:
          package-manager: bun
          install-policy: blocked
      - name: Record installed dependency state
        run: bun scripts/quality/install-state.mjs --write
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: "probe"
      - name: Lint TypeScript
        run: bun run lint
      - name: Lint Rust
        run: |
          cargo fmt --check --manifest-path probe/Cargo.toml
          cargo clippy --locked --all-features --manifest-path probe/Cargo.toml -- -D warnings
      - name: Record tested SHA
        id: tested-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  s3-workflow:
    name: "S3: Workflow"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tested-sha: ${{ steps.tested-sha.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint workflows
        uses: nocoo/base-ci/.github/actions/lint-workflows@e5876a604547b1ddb0916f16dd841a4f832609a0 # v2026.20
      - name: Record tested SHA
        id: tested-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  g1-secrets:
    name: "G1: Secrets"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tested-sha: ${{ steps.tested-sha.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Scan secrets
        uses: nocoo/base-ci/.github/actions/scan-secrets@e5876a604547b1ddb0916f16dd841a4f832609a0 # v2026.20
      - name: Record tested SHA
        id: tested-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  g2-dependencies:
    name: "G2: Dependencies"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tested-sha: ${{ steps.tested-sha.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan dependencies
        uses: nocoo/base-ci/.github/actions/scan-dependencies@e5876a604547b1ddb0916f16dd841a4f832609a0 # v2026.20
        with:
          lockfiles: |
            bun.lock
            probe/Cargo.lock
      - name: Record tested SHA
        id: tested-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  b1-build:
    name: "B1: Build"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tested-sha: ${{ steps.tested-sha.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup JavaScript
        uses: nocoo/base-ci/.github/actions/setup-js@e5876a604547b1ddb0916f16dd841a4f832609a0 # v2026.20
        with:
          package-manager: bun
          install-policy: blocked
      - name: Record installed dependency state
        run: bun scripts/quality/install-state.mjs --write
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: "probe"
          shared-key: "b1-opt0-v1"
      - name: Build dashboard, Worker and probe
        run: |
          (bun run build && (cd packages/worker && bun run build)) &
          js_pid=$!
          CARGO_PROFILE_RELEASE_OPT_LEVEL=0 CARGO_PROFILE_RELEASE_LTO=false CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16 \
            cargo build --locked --release --manifest-path probe/Cargo.toml
          wait "$js_pid"
      - name: Upload B1 worker static assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: b1-worker-static
          path: packages/worker/static/
          retention-days: 1
          if-no-files-found: error
      - name: Upload B1 shared dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: b1-shared-dist
          path: packages/shared/dist/
          retention-days: 1
          if-no-files-found: error
      - name: Upload B1 CLI dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: b1-cli-dist
          path: packages/cli/dist/
          retention-days: 1
          if-no-files-found: error
      - name: Upload B1 probe binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: b1-probe-bin
          path: probe/target/release/bat-probe
          retention-days: 1
          if-no-files-found: error
      - name: Record tested SHA
        id: tested-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  l1-unit-ts:
    name: "L1: Unit (TS)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tested-sha: ${{ steps.tested-sha.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup JavaScript
        uses: nocoo/base-ci/.github/actions/setup-js@e5876a604547b1ddb0916f16dd841a4f832609a0 # v2026.20
        with:
          package-manager: bun
          install-policy: blocked
      - name: Record installed dependency state
        run: bun scripts/quality/install-state.mjs --write
      - name: Build shared package
        run: bun turbo build --filter=@bat/shared
      - name: TypeScript coverage
        run: bash scripts/check-coverage.sh --ts
      - name: Script and environment unit tests
        run: |
          bun test scripts/release.test.ts scripts/probe-manifest.test.ts \
            scripts/quality/push-range.test.ts
          bun run test:environments:unit
          python3 -m unittest discover -s scripts -p 'test_prune_probe_releases.py'
      - name: Record tested SHA
        id: tested-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  l1-unit-rust:
    name: "L1: Unit (Rust)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tested-sha: ${{ steps.tested-sha.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: llvm-tools-preview
      - name: Install Rust coverage tool
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-llvm-cov@0.9.1
          fallback: none
      - name: Cache nightly coverage toolchain
        id: nightly-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.rustup/toolchains/nightly-*
          key: ${{ runner.os }}-rust-nightly-llvm-tools-v1
      - name: Install nightly coverage toolchain
        if: steps.nightly-cache.outputs.cache-hit != 'true'
        run: rustup toolchain install nightly --profile minimal --component llvm-tools-preview
      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: "probe"
          shared-key: "l1-nightly"
      - name: Rust coverage
        run: bash scripts/check-coverage.sh --rust
      - name: Record tested SHA
        id: tested-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  l2-runtime:
    name: "L2: Runtime"
    needs:
      - b1-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      tested-sha: ${{ steps.tested-sha.outputs.sha }}
    env:
      CLOUDFLARE_API_TOKEN: ""
      CLOUDFLARE_ACCOUNT_ID: ""
      CF_API_TOKEN: ""
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup JavaScript
        uses: nocoo/base-ci/.github/actions/setup-js@e5876a604547b1ddb0916f16dd841a4f832609a0 # v2026.20
        with:
          package-manager: bun
          install-policy: blocked
      - name: Record installed dependency state
        run: bun scripts/quality/install-state.mjs --write
      - name: Download B1 worker static assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: b1-worker-static
          path: packages/worker/static
      - name: Download B1 shared dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: b1-shared-dist
          path: packages/shared/dist
      - name: Real Wrangler D1 and KV binding checks
        run: bun scripts/quality/runtime-kv.mjs
      - name: Real Worker HTTP, D1 and Durable Object suite
        run: bun --cwd packages/worker run test:e2e
      - name: Record tested SHA
        id: tested-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  l3-integration-probe:
    name: "L3: Integration (Probe)"
    needs:
      - b1-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      tested-sha: ${{ steps.tested-sha.outputs.sha }}
    env:
      CLOUDFLARE_API_TOKEN: ""
      CLOUDFLARE_ACCOUNT_ID: ""
      CF_API_TOKEN: ""
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup JavaScript
        uses: nocoo/base-ci/.github/actions/setup-js@e5876a604547b1ddb0916f16dd841a4f832609a0 # v2026.20
        with:
          package-manager: bun
          install-policy: blocked
      - name: Record installed dependency state
        run: bun scripts/quality/install-state.mjs --write
      - name: Download B1 worker static assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: b1-worker-static
          path: packages/worker/static
      - name: Download B1 shared dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: b1-shared-dist
          path: packages/shared/dist
      - name: Download B1 probe binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: b1-probe-bin
          path: probe/target/release
      - name: Mark probe binary executable
        run: chmod +x probe/target/release/bat-probe
      - name: Structural route and page gates
        run: |
          bun run gate:routes
          bun run gate:pages
      - name: Probe to Worker to query integration
        env:
          BAT_PROBE_BIN: ${{ github.workspace }}/probe/target/release/bat-probe
        run: bun scripts/quality/probe-integration.mjs
      - name: Record tested SHA
        id: tested-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  l3-integration-env-1:
    name: "L3: Integration (Environments 1/2)"
    needs:
      - b1-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      tested-sha: ${{ steps.tested-sha.outputs.sha }}
    env:
      CLOUDFLARE_API_TOKEN: ""
      CLOUDFLARE_ACCOUNT_ID: ""
      CF_API_TOKEN: ""
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup JavaScript
        uses: nocoo/base-ci/.github/actions/setup-js@e5876a604547b1ddb0916f16dd841a4f832609a0 # v2026.20
        with:
          package-manager: bun
          install-policy: blocked
      - name: Record installed dependency state
        run: bun scripts/quality/install-state.mjs --write
      - name: Download B1 worker static assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: b1-worker-static
          path: packages/worker/static
      - name: Download B1 shared dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: b1-shared-dist
          path: packages/shared/dist
      - name: Local environment integration (1/2)
        run: bun scripts/environments/verify.mjs --part=1/2
      - name: Record tested SHA
        id: tested-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  l3-integration-env-2:
    name: "L3: Integration (Environments 2/2)"
    needs:
      - b1-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      tested-sha: ${{ steps.tested-sha.outputs.sha }}
    env:
      CLOUDFLARE_API_TOKEN: ""
      CLOUDFLARE_ACCOUNT_ID: ""
      CF_API_TOKEN: ""
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup JavaScript
        uses: nocoo/base-ci/.github/actions/setup-js@e5876a604547b1ddb0916f16dd841a4f832609a0 # v2026.20
        with:
          package-manager: bun
          install-policy: blocked
      - name: Record installed dependency state
        run: bun scripts/quality/install-state.mjs --write
      - name: Download B1 worker static assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: b1-worker-static
          path: packages/worker/static
      - name: Download B1 shared dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: b1-shared-dist
          path: packages/shared/dist
      - name: Local environment integration (2/2)
        run: bun scripts/environments/verify.mjs --part=2/2
      - name: Record tested SHA
        id: tested-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  l4-e2e:
    name: "L4: E2E"
    needs:
      - b1-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      tested-sha: ${{ steps.tested-sha.outputs.sha }}
    env:
      CLOUDFLARE_API_TOKEN: ""
      CLOUDFLARE_ACCOUNT_ID: ""
      CF_API_TOKEN: ""
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup JavaScript
        uses: nocoo/base-ci/.github/actions/setup-js@e5876a604547b1ddb0916f16dd841a4f832609a0 # v2026.20
        with:
          package-manager: bun
          install-policy: blocked
      - name: Record installed dependency state
        run: bun scripts/quality/install-state.mjs --write
      - name: Setup Playwright
        uses: nocoo/base-ci/.github/actions/setup-playwright@e5876a604547b1ddb0916f16dd841a4f832609a0 # v2026.20
        with:
          working-directory: packages/ui
          package-manager: bun
          browsers: chromium
      - name: Download B1 worker static assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: b1-worker-static
          path: packages/worker/static
      - name: Download B1 shared dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: b1-shared-dist
          path: packages/shared/dist
      - name: Browser journeys and environment capture
        run: |
          (bun run test:e2e:pw) &
          pw_pid=$!
          (bun run capture:environments) &
          cap_pid=$!
          status=0
          wait "$pw_pid" || status=$?
          wait "$cap_pid" || status=$?
          exit "$status"
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: packages/ui/playwright-report/
          retention-days: 7
          if-no-files-found: error
      - name: Upload environment capture evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: environment-captures
          path: artifacts/environments/automated/
          retention-days: 7
          if-no-files-found: error
      - name: Record tested SHA
        id: tested-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  p1-package:
    name: "P1: Package"
    needs:
      - b1-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tested-sha: ${{ steps.tested-sha.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup JavaScript
        uses: nocoo/base-ci/.github/actions/setup-js@e5876a604547b1ddb0916f16dd841a4f832609a0 # v2026.20
        with:
          package-manager: bun
          install-policy: blocked
      - name: Record installed dependency state
        run: bun scripts/quality/install-state.mjs --write
      - name: Download B1 CLI dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: b1-cli-dist
          path: packages/cli/dist
      - name: Mark CLI bin executable
        run: chmod +x packages/cli/dist/bat.js
      - name: Verify packed CLI consumer
        run: node scripts/quality/verify-package.mjs
      - name: Record tested SHA
        id: tested-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  z1-gate:
    name: "Z1: Gate"
    needs:
      - s1-types
      - s2-lint
      - s3-workflow
      - g1-secrets
      - g2-dependencies
      - b1-build
      - l1-unit-ts
      - l1-unit-rust
      - l2-runtime
      - l3-integration-probe
      - l3-integration-env-1
      - l3-integration-env-2
      - l4-e2e
      - p1-package
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tested-sha: ${{ steps.verify.outputs.tested-sha }}
    steps:
      - name: Verify all slots
        id: verify
        uses: nocoo/base-ci/.github/actions/z1-gate@e5876a604547b1ddb0916f16dd841a4f832609a0 # v2026.20
        with:
          needs-json: ${{ toJSON(needs) }}
          expected-sha: ${{ github.sha }}
          required-jobs: |
            s1-types=S1: Types
            s2-lint=S2: Lint
            s3-workflow=S3: Workflow
            g1-secrets=G1: Secrets
            g2-dependencies=G2: Dependencies
            b1-build=B1: Build
            l1-unit-ts=L1: Unit (TS)
            l1-unit-rust=L1: Unit (Rust)
            l2-runtime=L2: Runtime
            l3-integration-probe=L3: Integration (Probe)
            l3-integration-env-1=L3: Integration (Environments 1/2)
            l3-integration-env-2=L3: Integration (Environments 2/2)
            l4-e2e=L4: E2E
            p1-package=P1: Package
          skipped-jobs: ""
