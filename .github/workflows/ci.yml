name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@2857469cc5206e7a4988171a1282209617996a67
    with:
      runtime-version: "1.3.11"
      install-policy: "trusted"
      prepare-command: "bash scripts/ci-pre-command.sh"
      test-command: "bun run test:unit:coverage"
      osv-config: "osv-scanner.toml"
    secrets: inherit

  coverage-gates:
    name: "Coverage Gates"
    uses: nocoo/base-ci/.github/workflows/test-job.yml@2857469cc5206e7a4988171a1282209617996a67
    with:
      runtime-version: "1.3.11"
      install-policy: "trusted"
      timeout-minutes: 5
      command: |
        bun run gate:routes
        bun run gate:pages

  l2-e2e:
    name: "L2 Worker E2E"
    uses: nocoo/base-ci/.github/workflows/test-job.yml@2857469cc5206e7a4988171a1282209617996a67
    with:
      runtime-version: "1.3.11"
      install-policy: "blocked"
      timeout-minutes: 15
      pre-command: "bun run build"
      command: "bun turbo test:e2e --filter=@bat/worker"

  l3-playwright:
    name: "L3 Playwright E2E"
    uses: nocoo/base-ci/.github/workflows/test-job.yml@2857469cc5206e7a4988171a1282209617996a67
    with:
      runtime-version: "1.3.11"
      install-policy: "blocked"
      browser: "chromium"
      browser-working-directory: "packages/ui"
      timeout-minutes: 20
      pre-command: "bun run build"
      command: "bun run test:e2e:pw"
      artifact-name: playwright-report
      artifact-path: "packages/ui/playwright-report/"

  probe:
    name: "Probe (Rust)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: probe
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "probe -> target"
      - name: "L1: Probe unit tests"
        run: cargo test --all-features
      - name: "G1: Clippy lint"
        run: cargo clippy -- -D warnings
      - name: "G1: Format check"
        run: cargo fmt --check
