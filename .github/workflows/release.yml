name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to deploy (e.g. v2.3.0), or connect-access-audit for a read-only production audit"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Deploy Worker
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.tag != 'connect-access-audit') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success')
    uses: nocoo/base-ci/.github/workflows/deploy-worker.yml@ad43150de3a2be2fa464b5cd2f921dc4fa9f8f0f
    with:
      expected-workflow-path: ".github/workflows/ci.yml"
      expected-workflow-name: "CI"
      source-run-id: ${{ github.event_name == 'workflow_run' && format('{0}', github.event.workflow_run.id) || '' }}
      tag: ${{ github.event_name == 'push' && github.ref_name || inputs.tag || '' }}
      package-version-match: ${{ github.event_name != 'workflow_run' }}
      runtime-version: "1.3.11"
      install-policy: "blocked"
      build-command: "bun run build"
      wrangler-version: "4.130.0"
      wrangler-working-directory: "packages/worker"
      d1-migrations: true
      d1-command: "d1 migrations apply bat-db --remote --env production"
      deploy-command: deploy --env production
      environment: production
      concurrency-group: deploy-worker-production
      timeout-minutes: 15
      verify-command: |
        EXPECTED=$(jq -r .version package.json)
        HTTP=$(curl -fsS -o /tmp/live.json -w "%{http_code}" https://bat-ingest.worker.hexly.ai/api/live || echo "000")
        ACTUAL=$(jq -r .version /tmp/live.json 2>/dev/null || echo "?")
        test "$HTTP" = "200" && test "$ACTUAL" = "$EXPECTED"
      verify-retries: 6
      verify-retry-seconds: 5
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  connect-access-audit:
    name: Audit Connect Access
    if: github.event_name == 'workflow_dispatch' && inputs.tag == 'connect-access-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Checkout audit source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read Access and Worker metadata
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/connect-access-audit.py

  probe-release:
    name: "Probe Release"
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Resolve release source
        id: source
        uses: nocoo/base-ci/.github/actions/release-source@8cbdb970c3a38240289c1e152c40dd550ac62dba
        with:
          github-token: ${{ github.token }}
          expected-workflow-path: ".github/workflows/ci.yml"
          expected-workflow-name: "CI"
          tag: ${{ github.ref_name }}
          package-version-match: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.target-sha }}
          persist-credentials: false

      - name: Resolve version
        id: ver
        run: |
          VERSION=$(jq -r .version package.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          platforms: arm64

      - name: Build x86_64 binary
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: probe/Dockerfile.build
          platforms: linux/amd64
          outputs: type=local,dest=probe/out

      - name: Build aarch64 binary
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: probe/Dockerfile.build
          platforms: linux/arm64
          outputs: type=local,dest=probe/out-arm64

      - name: Rename aarch64 binary
        run: |
          mv probe/out-arm64/bat-probe-linux-x86_64 probe/out/bat-probe-linux-aarch64
          rm -rf probe/out-arm64

      - name: Generate checksums
        run: |
          cd probe/out
          sha256sum bat-probe-linux-x86_64 > bat-probe-linux-x86_64.sha256
          sha256sum bat-probe-linux-aarch64 > bat-probe-linux-aarch64.sha256

      - name: Verify binaries
        run: |
          file probe/out/bat-probe-linux-x86_64
          file probe/out/bat-probe-linux-aarch64

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: probe-binaries
          path: probe/out/
          retention-days: 7

      - name: Setup JS and frozen install
        uses: nocoo/base-ci/.github/actions/setup-js@081cdf665b9c67f233abfcc9242ce0be76ce2bb4
        with:
          package-manager: bun
          runtime-version: "1.3.11"
          install-policy: "blocked"

      - name: Upload to R2 (versioned + latest)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          WRANGLER="./packages/worker/node_modules/.bin/wrangler"
          test -x "$WRANGLER"
          reported=$("$WRANGLER" --version)
          echo "$reported" | grep -q "4.130.0"
          for tier in "$VERSION" latest; do
            for f in bat-probe-linux-x86_64 bat-probe-linux-aarch64 \
                     bat-probe-linux-x86_64.sha256 bat-probe-linux-aarch64.sha256; do
              echo "→ zhe/apps/bat/$tier/$f"
              "$WRANGLER" r2 object put "zhe/apps/bat/$tier/$f" \
                --file "probe/out/$f" --remote
            done
          done
