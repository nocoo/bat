name: Probe Release & Audit

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      action:
        description: "Maintenance action to run"
        required: true
        type: choice
        options:
          - connect-access-audit
        default: connect-access-audit

permissions:
  contents: read
  actions: read

jobs:
  connect-access-audit:
    name: Audit Connect Access
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'connect-access-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Checkout audit source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read Access and Worker metadata
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/connect-access-audit.py

  probe-release:
    name: "Probe Release"
    concurrency:
      group: bat-probe-r2-release
      cancel-in-progress: false
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Resolve release source
        id: source
        uses: nocoo/base-ci/.github/actions/release-source@9933a7461a312cfaac526ccc5907357a7e3f669a # v2026.25
        with:
          github-token: ${{ github.token }}
          expected-workflow-path: ".github/workflows/pipeline.yml"
          expected-workflow-name: "Pipeline"
          tag: ${{ github.ref_name }}
          package-version-match: true
          required-quality-check: "quality / Z1: Gate"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.target-sha }}
          persist-credentials: false

      - name: Resolve version
        id: ver
        run: |
          VERSION=$(jq -r .version package.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          platforms: arm64

      - name: Build x86_64 binary
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: probe/Dockerfile.build
          platforms: linux/amd64
          outputs: type=local,dest=probe/out

      - name: Build aarch64 binary
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: probe/Dockerfile.build
          platforms: linux/arm64
          outputs: type=local,dest=probe/out-arm64

      - name: Rename aarch64 binary
        run: |
          mv probe/out-arm64/bat-probe-linux-x86_64 probe/out/bat-probe-linux-aarch64
          rm -rf probe/out-arm64

      - name: Generate checksums
        run: |
          cd probe/out
          sha256sum bat-probe-linux-x86_64 > bat-probe-linux-x86_64.sha256
          sha256sum bat-probe-linux-aarch64 > bat-probe-linux-aarch64.sha256

      - name: Verify binaries
        run: |
          file probe/out/bat-probe-linux-x86_64
          file probe/out/bat-probe-linux-aarch64

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: probe-binaries
          path: probe/out/
          retention-days: 7

      - name: Setup JS and frozen install
        uses: nocoo/base-ci/.github/actions/setup-js@9933a7461a312cfaac526ccc5907357a7e3f669a # v2026.25
        with:
          package-manager: bun
          install-policy: "blocked"

      - name: Build probe manifest
        run: |
          cp probe/dist/bat-probe.service probe/out/bat-probe.service
          bun scripts/probe-manifest.mjs \
            --dir probe/out \
            --version "${{ steps.ver.outputs.version }}" \
            --out probe/out/manifest.json

      - name: Upload to R2 (versioned + latest)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          WRANGLER="./packages/worker/node_modules/.bin/wrangler"
          test -x "$WRANGLER"
          reported=$("$WRANGLER" --version)
          expected=$(jq -r .devDependencies.wrangler packages/worker/package.json)
          test "$reported" = "$expected"
          for tier in "$VERSION" latest; do
            for f in bat-probe-linux-x86_64 bat-probe-linux-aarch64 \
                     bat-probe-linux-x86_64.sha256 bat-probe-linux-aarch64.sha256 \
                     bat-probe.service manifest.json; do
              echo "→ zhe/apps/bat/$tier/$f"
              "$WRANGLER" r2 object put "zhe/apps/bat/$tier/$f" \
                --file "probe/out/$f" --remote
            done
          done

      - name: Retain newest three probe releases
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/prune-probe-releases.py --release-version "${{ steps.ver.outputs.version }}" --apply
